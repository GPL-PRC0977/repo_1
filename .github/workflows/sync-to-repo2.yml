- name: Push to Repo 2 staging
  env:
    REPO_2_PAT: ${{ secrets.REPO_2_PAT }}
    TARGET_REPO: GPL-PRC0977/repo_2
  shell: bash
  run: |
    set -uo pipefail

    git config user.name "github-actions[bot]"
    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    AUTH_HEADER="$(printf 'x-access-token:%s' "$REPO_2_PAT" | base64 -w 0)"
    TARGET_URL="https://github.com/${TARGET_REPO}.git"

    echo "Current source commit:"
    git log -1 --oneline

    echo "Target staging commit:"
    git \
      -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_HEADER" \
      ls-remote "$TARGET_URL" refs/heads/staging || true

    echo "Attempting push..."

    set +e
    OUTPUT="$(
      git \
        -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_HEADER" \
        push \
        "$TARGET_URL" \
        HEAD:refs/heads/staging \
        --force 2>&1
    )"
    STATUS=$?
    set -e

    printf '%s\n' "$OUTPUT"

    if [ "$STATUS" -ne 0 ]; then
      echo "::error title=Repo 2 push failed::Git exited with status $STATUS. Review the full push output above."
      exit "$STATUS"
    fi