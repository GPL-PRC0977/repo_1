name: Sync to Repo 2 Staging

on:
  push:
    branches:
      - main  # Change to your Repo 1 source branch if different

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo 1
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history so push succeeds cleanly

      - name: Push to Repo 2 Staging
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.REPO_2_PAT }}
          repository: 'GPL-PRC0977/repo_2'
          branch: 'staging'
          force: true