name: Sync to Repo 2 Staging

on:
  push:
    branches:
      - main

concurrency:
  group: sync-repo-2-staging
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo 1
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to Repo 2 staging
        env:
          PAT: ${{ secrets.REPO_2_PAT }}
          TARGET_REPO: "GPL-PRC0977/repo_2"
        shell: bash
        run: |
          set -euo pipefail

          # Fail fast if secret is not populated
          if [ -z "${PAT:-}" ]; then
            echo "ERROR: REPO_2_PAT secret is missing or empty."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Use direct URL-encoded inline access for cross-repo push
          git remote add target "https://x-access-token:${PAT}@github.com/${TARGET_REPO}.git"
          
          git push target HEAD:refs/heads/staging --force