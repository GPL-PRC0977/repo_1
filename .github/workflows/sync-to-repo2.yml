name: Sync to Repo 2 Staging

on:
  push:
    branches:
      - main  # Change to your source branch if different

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo 1
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify & Push to Repo 2
        env:
          PAT: ${{ secrets.REPO_2_PAT }}
        run: |
          # 1. Check if the secret is being detected
          if [ -z "$PAT" ]; then
            echo "CRITICAL ERROR: The secret REPO_2_PAT is empty or not accessible."
            echo "Please verify it exists under Repo 1 Settings -> Secrets and variables -> Actions."
            exit 1
          else
            echo "SUCCESS: REPO_2_PAT secret detected."
          fi

          # 2. Configure Git user details
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 3. Add Repo 2 remote
          git remote add target "https://x-access-token:${PAT}@github.com/GPL-PRC0977/repo_2.git"

          # 4. Attempt Push
          echo "Pushing code to GPL-PRC0977/repo_2 (staging branch)..."
          git push target HEAD:refs/heads/staging --force